<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travelia - AI Trip Planner</title>
    <noscript>
      <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding: 20px; text-align: center; font-family: sans-serif;">
          <h1>JavaScript Required</h1>
          <p>Please enable JavaScript to use this application.</p>
        </div>
      </noscript>
      <div id="loading" style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
        <div style="text-align: center;">
          <div style="font-size: 24px; margin-bottom: 10px;">⏳ Loading Travelia...</div>
          <div style="font-size: 14px; opacity: 0.8;">If this message persists, check the browser console.</div>
        </div>
      </div>
    </div>
    <script>
      // Show error immediately if script fails to load
      window.addEventListener('error', function(e) {
        console.error('Global error:', e.error, e.filename, e.lineno);
        var root = document.getElementById('root');
        var loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';
        if (root && !root.innerHTML.includes('Failed to load') && !root.innerHTML.includes('Error')) {
          root.innerHTML = '<div style="padding: 20px; text-align: center; font-family: sans-serif; background: #fee; border: 2px solid #fcc; margin: 20px; border-radius: 8px;"><h1 style="color: #c33;">Error Loading Application</h1><p>Error: ' + (e.message || 'Unknown error') + '</p><p style="font-size: 12px; color: #666;">File: ' + (e.filename || 'unknown') + ':' + (e.lineno || '?') + '</p><button onclick="window.location.reload()" style="margin-top: 10px; padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer;">Reload</button></div>';
        }
      }, true);
      
      // Timeout fallback - if app doesn't load in 10 seconds, show error
      setTimeout(function() {
        var root = document.getElementById('root');
        var loading = document.getElementById('loading');
        if (loading && loading.style.display !== 'none' && root.children.length === 1) {
          loading.innerHTML = '<div style="text-align: center;"><div style="font-size: 24px; margin-bottom: 10px;">⚠️ Application failed to load</div><div style="font-size: 14px; margin-bottom: 20px;">Please check the browser console (F12) for errors.</div><button onclick="window.location.reload()" style="padding: 10px 20px; background: white; color: #667eea; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Reload Page</button></div>';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
